<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10549b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shiksha 2.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Shiksha 2.0">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Shiksha 2.0 — Mock Test Series</title>
<style>
:root{
  color-scheme:light;
  --navy:#10549b; --bar:#0955ab; --blue:#3066c7;
  --paper:#f3f6fb; --line:#cfcec2; --qfont:16px;
  --brand:#0f4c8a; --brand2:#1d6fc2;
  --ok:#14833b; --bad:#c62828; --muted:#64748b;
  --bg:#eef3fa; --card:#fff; --border:#d4deed;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:#111;background:#fff}
body{font-family:"Times New Roman", Times, serif;}
button,select,input,textarea{font-family: Arial, sans-serif;}
button{cursor:pointer;border:0;transition:transform .14s ease,box-shadow .14s ease}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 7px #0002}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #167ad5;outline-offset:3px}
input,select,textarea{color:#17212d;background:#fff;user-select:text;-webkit-user-select:text}
img{-webkit-user-drag:none;object-fit:contain}
p{margin:10px 0}
table{border-collapse:collapse}
#app{min-height:100vh}

/* Watermarks */
.watermarks{position:fixed;inset:-70px 0;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:170px;overflow:hidden;pointer-events:none;z-index:0;opacity:.049;color:#737373;font:32px Arial;contain:strict}
.watermarks span{transform:rotate(-32deg);align-self:center;justify-self:center;white-space:nowrap}

/* Common header/footer */
.common-head{height:105px;position:relative;background:#fff;border-bottom:1px solid #d4deed}
.common-title{position:absolute;top:22px;left:18%;right:22%;text-align:center;font:bold 18px Arial;color:var(--brand)}
.common-sub{position:absolute;top:48px;left:18%;right:22%;text-align:center;font:13px Arial;color:#555}
.identity-strip{position:absolute;bottom:0;left:0;right:0;background:var(--bar);color:#fff;font:bold 12px Arial;padding:7px 15px;height:27px}
.common-footer{background:var(--bar);color:#fff;text-align:center;height:23px;font-size:11px;line-height:23px;position:relative;z-index:1}

/* Pre-exam wrappers */
.pre-body{min-height:calc(100vh - 128px);padding:16px 24px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.pre-body.welcome{align-items:flex-start;padding-top:18px}
.pre-body.ready{align-items:flex-start;padding-top:38px}
.panel{background:#f7f8fa;border-radius:15px;box-shadow:0 3px 9px #0002;width:min(100%,1000px);overflow:hidden}
.panel-title{margin:0;background:linear-gradient(105deg,var(--brand),var(--brand2));color:white;font:bold 17px Arial;padding:14px 20px}
.center{text-align:center}
.blue{color:var(--navy);font-weight:bold}
.continue{background:linear-gradient(#2c7095,#124366);color:white;border:1px solid #7893a4;font:bold 14px Arial;border-radius:0;padding:5px 12px}
.row-photos{display:flex;gap:14px;justify-content:center;margin:18px auto;flex-wrap:wrap}
.photo-card{background:#fafbfc;border:1px solid #d0d0d0;border-radius:13px;padding:15px 12px 10px;text-align:center;font:13px Arial}
.photo-card.small{padding:15px 12px}
.photo-card img{display:block;width:120px;height:120px;object-fit:contain;margin:auto}
.wide{width:min(100%,1040px)}

/* Registration */
.registration{min-height:100vh;background:#f4f7fb;display:flex;flex-direction:column}
.registration header{height:112px;background:#fff;border-bottom:20px solid var(--bar);position:relative;box-shadow:0 4px 3px #0001;flex-shrink:0}
.registration h1{margin:0;padding:20px 20px 0 20px;text-align:center;color:#165484;font-size:24px;font-family:Arial,sans-serif;}
.registration main{flex:1}
.reg-card{width:min(600px,calc(100% - 40px));margin:37px auto 28px;background:white;border-radius:15px;box-shadow:0 10px 25px #20324b1c;overflow:hidden}
.reg-title{padding:12px 16px;background:linear-gradient(100deg,#0e61a6,#104b8d);font:bold 17px Arial;color:white}
.reg-content{padding:24px}
.reg-field{display:grid;grid-template-columns:43% 57%;align-items:center;margin-bottom:16px;font:bold 14px Arial;color:#34414a}
.reg-field select,.reg-field input{border:1px solid #d1d2da;border-radius:8px;padding:8px 12px;font:bold 14px "Segoe UI",Arial;height:36px;width:100%}
.reg-field input[readonly]{background:#f1f4f8;color:#475569}
.reg-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.reg-login{width:160px;height:44px;border-radius:8px;color:white;background:linear-gradient(105deg,#0860a6,#1868b9);font:bold 15px Arial;box-shadow:0 5px 12px #07529825}
.reg-back{background:#eef4fb;color:var(--brand);border:1px solid #bcd1eb;font:bold 14px Arial;border-radius:8px;padding:10px 18px}
.disclaimer{width:min(740px,calc(100% - 40px));margin:0 auto 30px;border-left:5px solid #ff7d12;border-radius:12px;background:#fff;box-shadow:0 5px 12px #0001;padding:16px 20px;font:14px/1.6 "Segoe UI";color:#4c5660}
.disclaimer h3{font:bold 18px "Times New Roman";color:#dd5e09;margin:0 0 6px}

/* Welcome */
.system-no{background:#f2f5fa;border-radius:18px;text-align:center;margin-bottom:8px;padding:10px}
.system-no strong{display:block;font-size:40px;line-height:1.15;color:navy;font-family:"Times New Roman"}
.system-no b{font-size:18px}
.warning-frame{border:3px solid #e40000;border-radius:17px;padding:12px 16px;color:red;text-align:center;font:bold 17px/1.3 Arial;margin-bottom:20px}
.warning-frame h2{font-size:22px;margin:0 0 6px}
.warning-frame .hindi{font-size:17px;margin-top:4px}
.candidate-table{margin:0 auto;width:80%;font:bold 13px Arial;background:transparent}
.candidate-table td{border:1px solid #333;padding:7px}
.candidate-table td:nth-child(even){color:blue;text-align:center}
.duration{color:#ed1c00;background:yellow;font:italic bold 18px "Times New Roman"}
.welcome-login{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:bold;margin:18px 0 12px}
.welcome-login .arrow{font-size:32px;line-height:1;color:navy}

/* Login */
.login-wrap{width:585px;max-width:100%;text-align:center;margin-top:-16px}
.login-intro{color:var(--navy);font-weight:bold;margin:0 0 20px;font-size:15px}
.login-intro p{margin:6px}
.candidate-login{width:542px;max-width:100%;margin:auto}
.login-fields{font:bold 15px Arial;padding:18px 10px 15px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;text-align:left}
.login-fields input{border:1px solid #d4d7dc;border-radius:5px;font:14px Arial;height:36px;width:100%;padding:6px 10px}
.candidate-login .login-submit{display:block;margin:10px 20px 17px auto;color:white;background:linear-gradient(100deg,#2d73ae,#3286ca);border-radius:5px;padding:8px 26px;font:bold 14px Arial}
.keyboard{margin-top:10px;border:1px solid #888;padding:8px 12px 24px;background:#f8f9fb}
.key-row{display:flex;justify-content:center;gap:2px;margin-bottom:2px;flex-wrap:wrap}
.key{font:16px "Times New Roman";background:linear-gradient(white,#f4f4f4);border:1px solid #aaa;box-shadow:inset 1px 1px 2px #ddd;width:33px;height:33px;padding:0}
.key.backspace{width:100px;font-size:14px}
.keyboard-note{color:#c00;font-size:13px;margin-top:14px;font-weight:bold;text-align:center}

/* Verify */
.verify-block{width:min(100%,1000px);position:relative;z-index:1}
.verify-content{display:grid;grid-template-columns:1fr 1fr;padding:24px 32px;gap:20px}
.verify-table{font:bold 16px Arial;align-self:start}
.verify-table td{padding:7px 3px}
.verify-table td:last-child{color:#2c5cc5}
.verify-status{color:#c62828;text-align:center;font-weight:bold;margin:10px 0 16px;font-size:14px; font-family: 'Times New Roman', Times, serif;}
.verify-block .continue{display:block;margin:0 auto 20px}

/* Handwriting */
.handwriting{background:#fff;padding:18px}
.handwriting .intro{font:bold 14px Arial;color:#335ccd}
.handwriting-copy{border:1px solid #d5d5d5;background:#f8f9fa;border-radius:6px;padding:14px;line-height:1.65;font:14px/1.55 "Segoe UI"}
.handwriting-copy p{margin:0 0 12px}
.handwriting-copy p:last-child{margin:0}
.handwriting-confirm{color:#b7252c;font:bold 15px Arial;margin:16px 0 12px}
.handwriting-confirm label{cursor:pointer;display:inline-flex;align-items:center;gap:8px}

/* Language choice */
.language-panel{background:#f2f5fa;border-radius:0 0 14px 14px;text-align:center;padding:22px 30px 26px}

/* Ready */
.ready-card{background:white;border-radius:12px;box-shadow:0 3px 9px #0002;width:870px;max-width:100%;padding:14px 16px 16px}
.subject-table{width:100%;font:13px Arial}
.subject-table th,.subject-table td{border:1px solid #e1e3e7;padding:8px;text-align:left}
.subject-table th{font:bold 12px "Times New Roman";background:#eef3fa}
.subject-table tbody tr:nth-child(even){background:#f7f8fa}
.subject-table td:first-child{text-align:center}
.technical{background:#fff6f6;border:3px solid #c93138;border-radius:12px;box-shadow:0 0 13px #a821223a;overflow:hidden;text-align:left}
.technical h2{font:bold 22px Arial;color:#b9272c;margin:18px 16px 10px;text-align:center}
.technical ul{font-size:13px;line-height:1.85;padding-left:26px;margin:12px 16px 18px}
.ready-notice{font:bold 16px/1.25 Arial;color:blue;text-align:center;margin:26px 0 16px}
.ready-action{display:flex;align-items:center;justify-content:center;gap:8px;font:bold 17px Arial;padding-bottom:12px}
.get-ready{font:bold 16px Arial;color:white;background:linear-gradient(100deg,#0096ef,#00c8ef);padding:13px 34px;border-radius:12px;box-shadow:0 4px 10px #aaa}

/* Dashboard */
.dashboard{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;z-index:1}
.dash-header{background:#fff;border-bottom:3px solid var(--bar);padding:16px 24px;box-shadow:0 4px 6px #0001;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;position:relative;z-index:2}
.dash-title-group{display:flex;flex-direction:column;gap:4px;}
.dash-title-group h1{margin:0;font-size:24px;color:#10486d;font-weight:bold;font-family: Arial, sans-serif;}
.dash-title-group p{margin:0;font-size:14px;color:#555}
.dash-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-manage{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font:bold 13px Arial;padding:9px 18px;border-radius:22px;box-shadow:0 3px 8px #f59e0b44}
.dash-container{max-width:1200px;margin:24px auto 40px;padding:0 20px;width:100%;flex:1}
.info-chips-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:center;justify-content:center}
.info-chip{background:#fff;border:1px solid #c9d7e8;border-radius:20px;padding:7px 16px;font-size:13px;color:#223;box-shadow:0 2px 5px #0000000a}
.info-chip b{color:var(--brand)}
.global-stats-banner{background:linear-gradient(135deg,var(--brand),var(--brand2));border-radius:12px;color:#fff;padding:18px 24px;margin-bottom:24px;box-shadow:0 6px 18px #10549b28;display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:16px}
.stat-box-summary{text-align:center}
.stat-box-summary .val{font-size:22px;font-weight:bold}
.stat-box-summary .lbl{font-size:12px;opacity:.9;margin-top:4px}
.mock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.mock-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 3px 10px #0000000d;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.mock-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #00000018}
.mock-card-top{padding:16px 18px 12px;border-bottom:1px solid #eef2f7;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mock-card-num{width:40px;height:40px;border-radius:8px;background:#eaf2fb;color:var(--brand);font:bold 18px "Times New Roman";display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mock-card-titles{flex:1}
.mock-card-title{font-weight:bold;font-size:16px;color:#112233;line-height:1.3}
.mock-card-shift{font-size:13px;color:#5a697a;margin-top:3px}
.mock-card-body{padding:14px 18px;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.mock-card-badges{display:flex;flex-wrap:wrap;gap:8px}
.mock-tag{font-size:11px;font-weight:bold;padding:4px 10px;border-radius:12px;background:#f0f4f9;color:#495a6f}
.mock-tag.green{background:#e6f7ec;color:#0f7a36;border:1px solid #a3e0b7}
.mock-tag.blue{background:#eaf2fb;color:var(--brand);border:1px solid #b9d2ee}
.mock-score-info{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px}
.score-main{font-weight:bold;font-size:15px;color:#0f7a36}
.score-details{font-size:12px;color:var(--muted);margin-top:3px}
.mock-card-actions{display:flex;gap:10px;margin-top:4px}
.btn-start-mock{flex:1;background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff;font:bold 14px Arial;padding:11px 16px;border-radius:6px;box-shadow:0 3px 8px #105bad33}
.btn-solutions{flex:1;background:#e6f7ec;color:#0f7a36;border:1px solid #9ce0b3;font:bold 13px Arial;padding:9px 12px;border-radius:6px}
.btn-reattempt{background:#f0f4f9;color:var(--brand);border:1px solid #cbdbee;font:bold 13px Arial;padding:9px 14px;border-radius:6px}
.empty-state{text-align:center;padding:60px 20px;color:#64748b;font-size:15px;background:#fff;border-radius:12px;border:2px dashed #cbd5e1}

/* Admin */
.admin-shell{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;z-index:1}
.admin-head{background:#fff;border-bottom:3px solid var(--bar);padding:14px 24px;box-shadow:0 4px 6px #0001;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;position:sticky;top:0;z-index:5}
.admin-head h1{margin:0;font-size:19px;color:#10486d}
.admin-body{max-width:1100px;margin:24px auto;padding:0 20px;width:100%;flex:1}
.admin-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid #d4deed;flex-wrap:wrap}
.admin-tab{background:transparent;color:#475569;font:bold 14px Arial;padding:10px 18px;border-radius:8px 8px 0 0;margin-bottom:-2px}
.admin-tab.active{background:#fff;color:var(--brand);border-bottom:2px solid var(--brand)}
.admin-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:22px;box-shadow:0 3px 10px #0000000d}
.admin-panel h2{margin:0 0 14px;font-size:17px;color:#10486d}
.admin-panel h3{margin:14px 0 8px;font-size:14px;color:#334155}
.form-row{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:16px;margin-bottom:12px}
.form-row label{font-weight:bold;font-size:13px;color:#334155}
.form-row input,.form-row select{width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;background:#f8fafc}
.form-row input:focus,.form-row select:focus{background:#fff;border-color:#3676de;outline:none;box-shadow:0 0 3px #2464ed}
.btn-primary{background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff;font:bold 14px Arial;padding:10px 22px;border-radius:8px}
.btn-secondary{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;font:bold 13px Arial;padding:9px 18px;border-radius:8px}
.btn-danger{background:#c62828;color:#fff;font:bold 13px Arial;padding:9px 18px;border-radius:8px}
.btn-success{background:#14833b;color:#fff;font:bold 13px Arial;padding:9px 18px;border-radius:8px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mock-list{display:flex;flex-direction:column;gap:10px}
.mock-list-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mock-list-item .info{flex:1;min-width:180px}
.mock-list-item .info b{display:block;font-size:14px;color:#1e293b}
.mock-list-item .info span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.mock-list-item .actions{display:flex;gap:8px}

/* Bulk import */
.bulk-textarea{width:100%;min-height:220px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:12px/1.5 "Consolas","Courier New",monospace;resize:vertical;background:#f8fafc}
.bulk-textarea:focus{background:#fff;border-color:#3676de;outline:none;box-shadow:0 0 3px #2464ed}
.help-code{background:#f1f5f9;padding:6px 10px;border-radius:4px;font:11px/1.5 "Consolas",monospace;display:block;margin:8px 0;overflow-x:auto;color:#0f172a;border:1px solid #e2e8f0}
.parse-summary{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:12px 16px;margin:12px 0;font-size:13px}
.parse-summary.ok{background:#f0fdf4;border-color:#bbf7d0;color:#0f7a36}
.parse-summary.err{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.parse-preview{max-height:420px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px;margin-top:12px}
.parse-table{width:100%;font-size:12px}
.parse-table th{background:#eef2f7;padding:8px;text-align:left;position:sticky;top:0;border-bottom:2px solid #cbd5e1}
.parse-table td{padding:6px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.parse-table tr.row-invalid td{background:#fef2f2}
.parse-table .status-ok{color:#0f7a36;font-weight:bold}
.parse-table .status-err{color:#c62828;font-weight:bold}
.parse-table .preview-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parse-table .opt-badge{display:inline-block;padding:2px 6px;border-radius:8px;background:#dbeafe;color:#1e40af;font-size:10px;font-weight:bold}

/* Test shell */
body.running{overflow:hidden}
.test-shell{height:100vh;height:100dvh;min-height:440px;display:flex;flex-direction:column;position:relative}
.test-head{height:81px;flex:none;border-bottom:2px solid #105aaf;position:relative;background:white;font-weight:bold;flex-shrink:0;font-family:Arial, sans-serif;}
.test-title{position:absolute;left:20%;right:45%;text-align:center;top:4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#000}
.test-subtitle{position:absolute;left:20%;right:45%;text-align:center;top:26px;color:#600000;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.test-roll{position:absolute;left:20%;top:46px;font-size:12px;white-space:nowrap;color:#000}
.test-timer{position:absolute;left:68%;top:14px;width:15.5%;min-width:158px;background:#ffffcc;text-align:center;font-size:13px;height:40px;line-height:18px;padding-top:2px;border:1px solid #ccc}
.time-red{color:red;font-size:14px;font-weight:bold}
.zoom-controls{position:absolute;left:10px;bottom:4px;display:flex;gap:12px}
.zoom-btn{background:#096bb2;border-radius:14px;color:#fff;font:bold 13px Arial;min-width:85px;height:25px;padding:3px 13px;}
.test-content{min-height:0;flex:1;position:relative;display:flex;flex-direction:column;padding:0 14px 42px 0}
.test-tools{height:57px;flex:none;display:flex;align-items:center;gap:44px;padding:0 18px 0 32px;font-weight:bold;font-size:13px;flex-wrap:wrap}
.text-button{padding:0;background:none;color:inherit;font:inherit;border:0}
.text-button:hover{text-decoration:underline;box-shadow:none!important;transform:none!important}
.symbols-trigger{color:#006cb5}
.instructions-trigger{color:#dc891c}
.summary-trigger{color:#570000}
.all-count{margin-left:auto;white-space:nowrap;color:#111;font-size:12px}
.stat-number{color:#ff2600;background:yellow;font-weight:bold;padding:1px 6px;}
.btn-exit-exam{background:linear-gradient(#9c1c1c,#7a1010);color:white;border:1px solid #5a0a0a;border-radius:4px;font:bold 12px Arial;padding:4px 14px;margin-left:8px}
.test-controls{height:39px;flex:none;position:relative;display:flex;align-items:flex-start}
.part-badge{font:bold 16px "Times New Roman";background:green;color:#fff;padding:3px 6px;margin:6px 0 0 22px;letter-spacing:.5px}
.nav-buttons{position:absolute;left:18.7%;width:39%;display:flex;align-items:center;justify-content:center;gap:40px;padding-top:6px;}
.nav-btn{font:14px Arial;color:#fff;background:#3066c7;border-radius:4px;height:26px;min-width:120px;padding:3px 12px;white-space:nowrap}
.nav-btn.review{min-width:150px}
.btn-submit-exam{background:linear-gradient(#127233,#0b5123);color:white;border:1px solid #083d1a;border-radius:4px;font:bold 14px Arial;height:27px;padding:3px 24px;margin-left:16px;}

.exam-columns{display:flex;flex:1;min-height:0;gap:0}
.question-column{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.question-heading{height:26px;flex:none;padding:1px 7px;font:bold 13px "Times New Roman";letter-spacing:1px}
.palette-toggle{position:absolute;right:1px;top:-7px;width:30px;height:31px;background:transparent;padding:0;filter:drop-shadow(0 1px 1px #888);z-index:2}
.question-scroll{overflow:auto;flex:1;border:1px solid var(--line);padding:7px 16px 18px;background:#fff;position:relative}
.question-language{text-align:right;min-height:18px;font:bold 13px "Times New Roman";padding-right:16px;color:navy;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.question-language .text-button{text-decoration:underline}
.question-table{width:100%;margin:0;font:var(--qfont)/1.45 Arial,sans-serif;color:#111;background:#ffffff20}
.question-table td{border:1px solid var(--line)}
.question-prompt{padding:5px 4px 18px;vertical-align:top;line-height:1.6}
.option-cell{padding:0}
.option-label{display:flex;align-items:center;min-height:39px;cursor:pointer}
.radio-wrap{padding:5px 9px;border-right:1px solid #deddd4;align-self:stretch;display:flex;align-items:center;flex-shrink:0}
.option-label input{margin:0;width:14px;height:14px;accent-color:#078bef;cursor:pointer}
.option-text{padding:4px 4px;line-height:1.4;flex:1}
.clear-cell{padding:6px 0 17px}
.clear-btn{background:linear-gradient(#a00000,#860000);color:white;border:1px solid #690000;border-radius:3px;font:14px Arial;padding:6px 12px;margin-left:4px;}

.palette{width:20%;min-width:220px;max-width:310px;flex:none;display:flex;flex-direction:column;padding-top:0;overflow:hidden;max-height:100%;border-left:1px solid #e2e8f0;background:#fff}
.palette-title{text-align:center;font-weight:bold;font-size:14px;padding:0 5px 8px;min-height:22px;font-family:'Times New Roman', Times, serif;}
.palette-scroll{flex:1;overflow-y:auto;padding:0 9px}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:38px;justify-items:center;}
.palette-item{position:relative}
.q-number{display:block;color:white;background:blue;border-radius:3px;border:0;font:bold 12px Verdana;width:34px;height:15px;line-height:15px;padding:0}
.q-number.answered{background:green}
.q-number.marked{background:red}
.q-number.answered.marked{background:yellow;color:black}
.q-marker{font:16px Arial;display:block;text-align:center;position:absolute;top:16px;width:100%;line-height:16px}
.palette[hidden]{display:none}
.analysis-table{margin:8px;font-size:13px;flex-shrink:0;font-family:Arial, sans-serif;}
.analysis-table th,.analysis-table td{border:1px solid #999;padding:5px 8px}
.analysis-table th{background:#ccc;font-weight:bold;text-align:center;}
.analysis-table td:last-child{width:50px;text-align:center;font-weight:bold;}

/* Section Tabs */
.section-tabs{display:flex;background:#eef3fa;border-bottom:2px solid #105aaf;flex-shrink:0}
.section-tab{flex:1;text-align:center;padding:10px 5px;font:bold 13px Arial;color:#475569;background:#e2e8f0;border-right:1px solid #cbd5e1;cursor:default;position:relative;}
.section-tab.active{background:#fff;color:var(--brand);border-bottom:3px solid var(--brand);}
.section-tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:3px;background:var(--brand);}
.section-tab.locked{color:#94a3b8;background:#f8fafc;}

/* Overlays */
.overlay-layer{position:absolute;inset:0;pointer-events:none;z-index:20}
.overlay-layer>*{pointer-events:auto}
.overlay-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.summary-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 30px));background:white;box-shadow:0 8px 26px #0006;border:1px solid #ccc;}
.symbols-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 30px));background:white;border:1px solid #ccc;}
.symbols-pop table{width:100%}
.symbols-pop th{background:#ccc;color:#111;font-size:13px;padding:10px;text-align:center;border:1px solid #999;}
.symbols-pop td{border:1px solid #999;padding:8px;font-size:13px}
.symbols-pop td:first-child{text-align:center;width:90px}
.symbols-pop .q-number{margin:auto}
.instructions-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 30px));max-height:calc(100% - 40px);background:white;border:1px solid #ccc;display:flex;flex-direction:column}
.instructions-card{display:flex;flex-direction:column;height:100%;overflow:hidden}
.instructions-copy{padding:8px 20px 20px;overflow:auto;flex:1}
.instructions-copy ul{padding-left:26px;margin:8px 0}
.instructions-copy li{margin:8px 0;font-size:13px;line-height:1.5}
.overlay-close-row{text-align:center;padding:12px;background:#f8fafc;border-top:1px solid #e2e8f0}

/* Result */
.result-shell{min-height:100vh;background:var(--bg);padding:30px 16px;position:relative;z-index:1}
.result-card{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 6px 24px #0000001a;overflow:hidden;border:1px solid var(--border)}
.result-header{background:linear-gradient(105deg,var(--brand),var(--brand2));color:#fff;padding:22px 24px;text-align:center}
.result-header h2{margin:0;font-size:22px;font-family:"Times New Roman",serif}
.result-header p{margin:6px 0 0;opacity:.9;font-size:13px}
.result-body{padding:26px 24px}
.score-hero-box{text-align:center;margin-bottom:24px;padding:20px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px}
.score-hero-number{font-size:44px;font-weight:800;color:var(--brand);line-height:1.1;font-family:"Times New Roman",serif}
.score-hero-label{font-size:13px;color:var(--muted);font-weight:bold;margin-top:6px}
.stats-grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat-pill-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 10px;text-align:center}
.stat-pill-card.correct{border-left:4px solid var(--ok)}
.stat-pill-card.wrong{border-left:4px solid var(--bad)}
.stat-pill-card.unanswered{border-left:4px solid #94a3b8}
.stat-pill-card.accuracy{border-left:4px solid var(--brand)}
.stat-pill-card.time{border-left:4px solid #d97706}
.stat-pill-card .val{font-size:20px;font-weight:bold;color:#1e293b}
.stat-pill-card .lbl{font-size:11px;color:var(--muted);margin-top:4px}
.bar-breakdown{width:100%;max-width:480px;height:14px;border-radius:7px;overflow:hidden;display:flex;background:#e2e8f0;margin:10px auto}
.bar-breakdown i{height:100%}
.section-results-table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px;font-family:Arial,sans-serif;}
.section-results-table th, .section-results-table td{border:1px solid #cbd5e1;padding:8px;text-align:center;}
.section-results-table th{background:#eef3fa;}
.result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:22px;border-top:1px solid #eef2f7}
.btn-action-primary{background:linear-gradient(105deg,var(--brand),var(--brand2));color:#fff;padding:11px 26px;font:bold 14px Arial;border-radius:6px;box-shadow:0 3px 8px #10549b33}
.btn-action-secondary{background:#eef4fb;color:var(--brand);border:1px solid #bcd1eb;padding:11px 22px;font:bold 13px Arial;border-radius:6px}

/* Solutions */
.solutions-shell{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;z-index:1}
.sol-head{background:#fff;border-bottom:2px solid var(--bar);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 3px 6px #0001;position:sticky;top:0;z-index:5}
.sol-title-wrap h2{margin:0;font-size:17px;color:#10486d;font-family:"Times New Roman",serif}
.sol-title-wrap p{margin:2px 0 0;font-size:12px;color:#666}
.sol-meta-badges{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sol-meta-chip{font-size:12px;font-weight:bold;padding:5px 12px;border-radius:12px;background:#f0f4f9;color:#334}
.sol-meta-chip.score{background:#e6f7ec;color:#0f7a36;border:1px solid #9ce0b3}
.sol-filter-strip{background:#f8fafc;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.sol-filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{border:1px solid #cbd5e1;background:#fff;padding:5px 14px;border-radius:15px;font-size:12px;font-weight:bold;color:#475569}
.filter-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 5px #10549b33}
.sol-main{display:flex;flex:1;max-width:1400px;margin:16px auto;width:100%;padding:0 16px;gap:20px;min-height:0}
.sol-q-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.sol-card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 8px #0001;overflow:hidden;padding:18px;scroll-margin-top:130px}
.sol-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid #f1f5f9;padding-bottom:8px;gap:12px;flex-wrap:wrap}
.sol-q-num-badge{font:bold 14px "Times New Roman";color:var(--brand);background:#eaf2fb;padding:4px 10px;border-radius:6px}
.sol-status-banner{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold}
.sol-status-banner.correct{background:#e6f7ec;color:var(--ok);border:1px solid #9ce0b3}
.sol-status-banner.wrong{background:#fdecec;color:var(--bad);border:1px solid #f8b4b4}
.sol-status-banner.unattempted{background:#f1f5f9;color:var(--muted);border:1px solid #cbd5e1}
.sol-prompt{font-size:14px;line-height:1.6;color:#1e293b;margin-bottom:14px}
.sol-options-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.sol-opt-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid #e2e8f0;border-radius:6px;font-size:14px;background:#fff;gap:12px}
.sol-opt-row.is-correct{background:#e6f7ec;border-color:var(--ok);color:#0f7a36;font-weight:600}
.sol-opt-row.is-user-wrong{background:#fdecec;border-color:var(--bad);color:#b91c1c;font-weight:600}
.sol-opt-letter{font-weight:bold;width:26px;color:#475569;flex-shrink:0}
.sol-opt-row.is-correct .sol-opt-letter{color:var(--ok)}
.sol-opt-row.is-user-wrong .sol-opt-letter{color:var(--bad)}
.sol-opt-text{flex:1}
.sol-opt-tag{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:10px;white-space:nowrap}
.sol-opt-tag.cor{background:var(--ok);color:#fff}
.sol-opt-tag.wrg{background:var(--bad);color:#fff}
.sol-explanation{margin-top:12px;padding:12px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px;line-height:1.65;color:#78350f}
.sol-explanation b{display:block;margin-bottom:6px;color:#92400e;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.sol-palette-col{width:260px;flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:0 2px 8px #0001;height:fit-content;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow-y:auto}
.sol-pal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.sol-pal-btn{height:30px;border-radius:4px;border:0;font-weight:bold;font-size:11px;color:#fff;cursor:pointer}
.sol-pal-btn.c{background:var(--ok)}
.sol-pal-btn.w{background:var(--bad)}
.sol-pal-btn.u{background:#94a3b8}

/* Math formatting */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.fr>span:last-child{padding:0 2px}
sup{font-size:.7em;vertical-align:super;line-height:0}
u.hl{text-decoration:underline;font-weight:bold}

/* Responsive */
@media(max-width:860px){
  .sol-main{flex-direction:column}
  .sol-palette-col{width:100%;position:static;order:-1;max-height:none}
  .dash-header,.admin-head{flex-direction:column;align-items:flex-start}
  .form-row{grid-template-columns:1fr;gap:6px}
  .common-title{font-size:14px;left:14%;right:20%}
  .common-sub{left:14%;right:20%;font-size:11px}
  .test-title{left:14%;right:36%;font-size:11px}
  .test-subtitle{left:14%;right:36%;font-size:10px}
  .test-roll{left:14%;font-size:11px;top:50px}
  .test-timer{right:6px;top:8px;min-width:110px;font-size:11px;padding:4px 6px}
  .test-tools{gap:8px;padding:4px 8px;height:auto;flex-wrap:wrap;font-size:11px}
  .all-count{margin-left:0;font-size:10px}
  .nav-btn,.btn-submit-exam{font-size:11px;padding:4px 10px;height:auto}
  .part-badge{display:none}
  .test-controls{height:auto;flex-wrap:wrap;padding:4px 8px 6px;gap:6px}
  .palette{min-width:150px;width:32%}
  .palette-grid{padding:4px;gap:3px;grid-auto-rows:32px}
  .q-number{width:24px;font-size:10px;height:14px;line-height:14px}
  .question-scroll{padding:6px 8px}
  .question-table{font-size:calc(var(--qfont) - 1px)}
  .registration h1{font-size:17px;padding:16px 10px 0 90px}
  .reg-field{grid-template-columns:1fr;gap:4px;font-size:13px}
  .login-fields{grid-template-columns:1fr;gap:8px}
  .login-fields input{width:100%}
  .key{width:26px;font-size:14px;height:30px}
  .key.backspace{width:76px;font-size:12px}
  .verify-content{grid-template-columns:1fr;padding:16px}
  .pre-body{padding:12px}
  .handwriting{padding:12px}
  .language-panel{padding:16px}
  .mock-grid{grid-template-columns:1fr}
  .dashboard .dash-title-group h1{font-size:18px}
}
@media(prefers-reduced-motion:reduce){button{transition:none!important;transform:none!important}}
</style>

/* ---------- Storage ---------- */
function loadSettings() {
  try {
    const raw = localStorage.getItem(K_SETTINGS);
    if (raw) SETTINGS = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch(e) {}
}
function saveSettings() { try { localStorage.setItem(K_SETTINGS, JSON.stringify(SETTINGS)); } catch(e) {} }
function loadMocks() {
  try {
    const raw = localStorage.getItem(K_MOCKS);
    if (!raw) return;
    const data = JSON.parse(raw);
    MOCKS = Array.isArray(data) ? data : (Array.isArray(data.mocks) ? data.mocks : []);
    
    // MIGRATION: Fix any old mocks that don't have parts
    let migrated = false;
    MOCKS.forEach(m => {
      if (!m.parts || !Array.isArray(m.parts)) {
        m.parts = [{
          name: 'Part A: General', 
          qCount: m.questions ? m.questions.length : 0, 
          time: m.duration || 60
        }];
        migrated = true;
      }
    });
    if (migrated) saveMocks();
  } catch(e) { MOCKS = []; }
}
function saveMocks() { try { localStorage.setItem(K_MOCKS, JSON.stringify(MOCKS)); } catch(e) {} }
function loadAttempts() {
  try {
    const raw = localStorage.getItem(K_ATTEMPTS);
    if (raw) ATTEMPTS = JSON.parse(raw) || {};
  } catch(e) { ATTEMPTS = {}; }
}

/* ---------- Utilities ---------- */
function uid() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmt(s) {
  if (s == null || s === '') return '';
  const parts = String(s).split(/<br\s*\/?>/i);
  return parts.map(part => {
    let t = esc(part);
    t = t.replace(/\[\[([^\[\]|]*)\|([^\[\]]*?)\]\]/g,
      '<span class="fr"><span>$1</span><span>$2</span></span>');
    t = t.replace(/\^\(([^()]*)\)/g, '<sup>$1</sup>');
    t = t.replace(/\^([0-9]+)/g, '<sup>$1</sup>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    t = t.replace(/_(.+?)_/g, '<u>$1</u>');
    return t;
  }).join('<br>');
}

function rich(s) {
  if (s == null || s === '') return '';
  const raw = String(s);
  const paragraphs = raw.split(/<br\s*\/?>\s*<br\s*\/?>/i);
  return paragraphs.map(p => {
    const lines = p.split(/<br\s*\/?>/i);
    return '<div style="margin-bottom:10px;">' + lines.map(line => {
      let t = line;
      t = t.replace(/<(?!\/?(table|tr|td|th|tbody|thead|b|i|u|sup|br)\b)[^>]+>/gi, match => esc(match));
      t = t.replace(/\[\[([^\[\]|]*)\|([^\[\]]*?)\]\]/g, '<span class="fr"><span>$1</span><span>$2</span></span>');
      t = t.replace(/\^\(([^()]*)\)/g, '<sup>$1</sup>');
      t = t.replace(/\^([0-9]+)/g, '<sup>$1</sup>');
      t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      t = t.replace(/_(.+?)_/g, '<u>$1</u>');
      return t;
    }).join('<br>') + '</div>';
  }).join('');
}

function parseCSVLine(line) {
  const out = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function splitBilingual(text) {
  if (text == null) return { en: '', hi: '', single: true };
  const idx = text.indexOf(':::');
  if (idx === -1) {
    const t = String(text).trim();
    return { en: t, hi: t, single: true };
  }
  return {
    en: text.slice(0, idx).trim(),
    hi: text.slice(idx + 3).trim(),
    single: false
  };
}

function buildQuestion(cols) {
  if (!cols || cols.length < 7) return { error: 'Fewer than 7 columns' };
  const qRaw = cols[0] || '';
  const o1 = cols[1] || '';
  const o2 = cols[2] || '';
  const o3 = cols[3] || '';
  const o4 = cols[4] || '';
  const o5 = cols[5] || '';
  const ansRaw = cols[6] || '';
  const expRaw = cols[7] != null ? cols[7] : '';

  const ans = parseInt(ansRaw, 10);
  const has5 = o5.trim() !== '';
  const optionCount = has5 ? 5 : 4;

  if (!(ans >= 1 && ans <= optionCount)) {
    return { error: `Correct answer must be 1–${optionCount}, got "${ansRaw}"` };
  }

  const q = splitBilingual(qRaw);
  const optParts = [o1, o2, o3, o4];
  if (has5) optParts.push(o5);
  const optSplit = optParts.map(splitBilingual);
  const exp = splitBilingual(expRaw);

  const bilingual = !q.single || !exp.single || optSplit.some(p => !p.single);

  const enOpts = optSplit.map(p => p.en);
  const hiOpts = optSplit.map(p => p.hi);

  for (let i = 0; i < optSplit.length; i++) {
    if (optSplit[i].single) {
      enOpts[i] = optSplit[i].en;
      hiOpts[i] = optSplit[i].hi || optSplit[i].en;
    }
  }

  if (!q.en && !q.hi) return { error: 'Question text is empty' };

  const built = {
    bilingual,
    optionCount,
    en: { q: q.en, o: enOpts, a: ans - 1, exp: exp.en },
    hi: { q: q.hi, o: hiOpts, a: ans - 1, exp: exp.hi }
  };
  if (!bilingual) {
    built.hi = JSON.parse(JSON.stringify(built.en));
  }
  return { question: built };
}

}
function footer() {
  return `<footer class="common-footer">${esc(BRAND)} · Mock Test Series · ${esc(SETTINGS.examLabel)}</footer>`;
}
function wm() {
  return `<div class="watermarks" aria-hidden="true">${Array.from({length:60}, () => '<span>' + esc(BRAND) + '</span>').join('')}</div>`;
}
function pre(content, cls = '', subtitle = '') {
  return `${headerCommon(subtitle)}${wm()}<main class="pre-body ${cls}">${content}</main>${footer()}`;
}

function renderDashboard() {
  const mockCount = MOCKS.length;
  const attemptedKeys = Object.keys(ATTEMPTS).filter(k => ATTEMPTS[k] != null);
  const attemptedCount = attemptedKeys.length;
  let totalScore = 0, maxScore = 0;
  attemptedKeys.forEach(k => {
    const sc = ATTEMPTS[k].score;
    totalScore += sc;
    if (sc > maxScore) maxScore = sc;
  });
  const avgScore = attemptedCount > 0 ? (totalScore / attemptedCount).toFixed(1) : '—';

  return `<div class="dashboard">${wm()}
    <header class="dash-header">
      <div class="dash-title-group">
        <h1>${esc(BRAND_FULL)}</h1>

        <div class="info-chip"><b>Bilingual</b> EN / HI</div>

          <div class="val">${attemptedCount} / ${mockCount}</div>
          <div class="lbl">Tests Attempted</div>
        </div>
        <div class="stat-box-summary">
          <div class="val">${attemptedCount > 0 ? maxScore.toFixed(1) : '—'}</div>
          <div class="lbl">Best Score</div>
        </div>
        <div class="stat-box-summary">
          <div class="val">${avgScore}</div>
          <div class="lbl">Average Score</div>
        </div>
      </div>

      ${mockCount === 0 ? `
        <div class="empty-state">
          <p style="font-size:17px; font-weight:bold; margin-bottom:8px;">No mocks yet</p>

        </div>
      ` : `
        <div class="mock-grid">
          ${MOCKS.map((m, i) => {
            const att = ATTEMPTS[m.id];
            const isDone = att != null;
            const qCount = m.parts.reduce((sum, p) => sum + p.qCount, 0);
            const totalMin = m.parts.reduce((sum, p) => sum + p.time, 0);
            return `<div class="mock-card">

              </div>
              <div class="mock-card-body">
                <div class="mock-card-badges">

function exportData() {
  const data = {
    version: '1.0',
    brand: BRAND,
    exportedAt: new Date().toISOString(),
    settings: SETTINGS,
    mocks: MOCKS,
    attempts: ATTEMPTS
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shiksha2-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exported');
}

function importData(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      const incoming = Array.isArray(data.mocks) ? data.mocks : (Array.isArray(data) ? data : null);
      if (!incoming) throw new Error('No mocks array found');
      if (!confirm(`Import ${incoming.length} mock(s)? This will REPLACE current mocks and settings.`)) return;
      SETTINGS = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
      MOCKS = incoming;
      ATTEMPTS = data.attempts || {};
      saveSettings(); saveMocks(); saveAttempts();
      toast('Imported');
      render();
    } catch(err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

function resetAll() {
  if (!confirm('Delete ALL mocks, settings, and attempts? This cannot be undone.')) return;
  localStorage.removeItem(K_SETTINGS);
  localStorage.removeItem(K_MOCKS);
  localStorage.removeItem(K_ATTEMPTS);
  SETTINGS = { ...DEFAULT_SETTINGS };
  MOCKS = [];
  ATTEMPTS = {};
  state.editingMock = null;
  state.stage = 'admin';
  state.adminTab = 'data';
  toast('All data reset');
  render();
}

function clearBulk() {
  const ta = document.getElementById('bulk-input');
  if (ta) ta.value = '';
  state.parsedRows = null;
  state.parsedValidCount = 0;
  const r = document.getElementById('parse-result');
  if (r) r.innerHTML = '';
}

function parseBulk() {
  const ta = document.getElementById('bulk-input');
  const raw = (ta.value || '').trim();
  if (!raw) { alert('Paste some rows first.'); return; }
  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  const rows = [];
  let validCount = 0;
  lines.forEach((line, idx) => {
    if (idx === 0 && /question/i.test(line) && /option\s*1/i.test(line)) return;
    const cols = parseCSVLine(line);
    const res = buildQuestion(cols);
    if (res.error) {
      rows.push({ line: idx + 1, raw: line, error: res.error, valid: false });
      return;
    }
    rows.push({ line: idx + 1, raw: line, question: res.question, valid: true });
    validCount++;
  });
  state.parsedRows = rows;
  state.parsedValidCount = validCount;
  const container = document.getElementById('parse-result');
  if (container) container.innerHTML = renderParsePreview();
}

function renderParsePreview() {
  const rows = state.parsedRows || [];
  const valid = state.parsedValidCount;
  const invalid = rows.filter(r => !r.valid).length;
  return `
    <div class="parse-summary ${invalid === 0 ? 'ok' : 'err'}">
      <b>${valid}</b> valid · <b>${invalid}</b> invalid · <b>${rows.length}</b> total
    </div>
    <div class="parse-preview">
      <table class="parse-table">
        <thead><tr><th>Line</th><th>Status</th><th>Question (EN)</th><th>Error</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr class="${r.valid ? '' : 'row-invalid'}">
              <td>${r.line}</td>
              <td>${r.valid ? '<span class="status-ok">✔ OK</span>' : '<span class="status-err">✘ Err</span>'}</td>
              <td class="preview-cell">${r.valid ? esc((r.question.en.q || r.question.hi.q || '').slice(0, 60)) : esc(r.raw.slice(0, 60))}</td>
              <td style="color:#c62828; font-size:11px;">${r.valid ? '' : esc(r.error)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    ${valid > 0 ? `
      <div class="btn-row">
        <button class="btn-primary" onclick="commitBulk()">Commit ${valid} Question(s)</button>
      </div>
    ` : ''}
  `;
}

function commitBulk() {
  if (!state.parsedRows) return;
  const validRows = state.parsedRows.filter(r => r.valid);
  if (validRows.length === 0) return;

  const m = state.editingMock;
  // If questions don't exist yet, initialize
  if (!m.questions) m.questions = [];
  
  // Append new questions
  m.questions.push(...validRows.map(r => r.question));

  const ta = document.getElementById('bulk-input');
  if (ta) ta.value = '';
  state.parsedRows = null;
  state.parsedValidCount = 0;
  toast(`Added ${validRows.length} question(s)`);
  render();
}

function removeQuestion(idx) {
  if (!confirm('Remove this question?')) return;
  state.editingMock.questions.splice(idx, 1);
  render();
}

function saveMock() {
  const m = state.editingMock;
  m.title = (document.getElementById('me-title').value || 'Untitled Mock').trim();
  m.examLabel = (document.getElementById('me-exam').value || SETTINGS.examLabel).trim();
  m.posMark = Math.max(0, parseFloat(document.getElementById('me-pos').value) || 0);
  m.negMark = Math.max(0, parseFloat(document.getElementById('me-neg').value) || 0);

  // Read part configs
  m.parts = m.parts.map((p, i) => ({
    name: document.getElementById('part-name-'+i).value.trim() || `Part ${String.fromCharCode(65+i)}`,
    qCount: parseInt(document.getElementById('part-q-'+i).value) || 0,
    time: parseInt(document.getElementById('part-t-'+i).value) || 15
  })).filter(p => p.qCount > 0);

  const totalQ = m.parts.reduce((s,p)=>s+p.qCount,0);
  
  if (!m.questions || m.questions.length < totalQ) {
    alert(`You have defined ${totalQ} questions in the parts, but only imported ${m.questions ? m.questions.length : 0}. Please import more questions.`);
    return;
  }

  // Trim extra questions just in case
  if (m.questions.length > totalQ) {
    m.questions = m.questions.slice(0, totalQ);
  }

  const existingIdx = MOCKS.findIndex(x => x.id === m.id);
  if (existingIdx >= 0) MOCKS[existingIdx] = m;
  else MOCKS.push(m);
  
  saveMocks();
  toast('Mock saved');
  state.stage = 'admin';
  state.adminTab = 'mocks';
  state.editingMock = null;
  render();
  window.scrollTo(0, 0);
}

function cancelEditMock() {
  state.editingMock = null;
  state.parsedRows = null;
  state.stage = 'admin';
  state.adminTab = 'mocks';
  render();
}

function deleteMock(id) {
  const m = MOCKS.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`Delete "${m.title}"? Its attempt history will also be removed.`)) return;
  MOCKS = MOCKS.filter(x => x.id !== id);
  delete ATTEMPTS[id];
  saveMocks(); saveAttempts();
  toast('Mock deleted');
  render();
}

/* ---------- Test screen helpers ---------- */
function idx() { return state.q; }

function counts() {
  const m = MOCKS.find(x => x.id === state.mockId);
  const part = m.parts[state.partIndex];
  const startQ = m.parts.slice(0, state.partIndex).reduce((s,p)=>s+p.qCount,0);
  const endQ = startQ + part.qCount;
  
  let answered = 0, marked = 0, markedAnswered = 0, notVisited = 0;
  for (let i = startQ; i < endQ; i++) {
    const a = state.answers[i] != null;
    const r = state.review[i];
    if (a && r) markedAnswered++;
    else if (a) answered++;
    else if (r) marked++;
    else notVisited++;
  }
  return { answered, marked, markedAnswered, notVisited, total: part.qCount, startQ, endQ };
}

function clock() {
  const deadline = state.deadlines[state.partIndex];
  if (!deadline) return "00:00";
  const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function arrowSvg() {
  return `<svg viewBox="0 0 26 32" aria-hidden="true" style="width:100%; height:100%; ${state.hidden ? 'transform:rotate(180deg);' : ''}"><polygon points="0,0 26,16 0,32" fill="#10549b"/></svg>`;
}

function renderQuestion() {
  const m = MOCKS.find(x => x.id === state.mockId);
  if (!m) return '';
  const q = m.questions[idx()];
  const isHindi = state.language === 'Hindi';
  const data = isHindi ? q.hi : q.en;
  const opts = data.o;
  const bilingual = q.bilingual;
  const refLang = isHindi ? 'English' : 'हिन्दी';

  const part = m.parts[state.partIndex];
  const startQ = m.parts.slice(0, state.partIndex).reduce((s,p)=>s+p.qCount,0);
  const localQNum = state.q - startQ + 1;

  return `<div class="question-language">
    <button class="text-button" data-action="toggle-lang" ${bilingual ? '' : 'disabled title="Toggle not available for single-language question"'} style="${bilingual ? 'text-decoration:underline' : 'text-decoration:none; color:#94a3b8; cursor:not-allowed;'}">${refLang} Version</button>
  </div>
  <table class="question-table">
    <tbody>
      <tr><td class="question-prompt"><b style="color:var(--brand);">Question No. ${localQNum}</b><br><br>${rich(data.q)}</td></tr>
      ${opts.map((o, i) => `<tr><td class="option-cell"><div class="option-label"><span class="radio-wrap"><input type="radio" name="answer" value="${i}" aria-label="Option ${i + 1}" ${state.answers[idx()] === i ? 'checked' : ''}></span><span class="option-text"><b>(${'ABCDE'[i]})</b> &nbsp;${fmt(o)}</span></div></td></tr>`).join('')}
      <tr><td class="clear-cell"><button class="clear-btn" data-action="clear">Clear Response</button></td></tr>
    </tbody>
  </table>`;
}

function paletteButtons() {
  const c = counts();
  let html = '';
  for (let i = c.startQ; i < c.endQ; i++) {
    const a = state.answers[i] != null;
    const r = state.review[i];
    let cls = 'q-number';
    if (a && r) cls += ' answered marked';
    else if (a) cls += ' answered';
    else if (r) cls += ' marked';
    const localNum = i - c.startQ + 1;
    html += `<div class="palette-item"><button class="${cls}" data-q="${i}">${localNum}</button></div>`;
  }
  return html;
}

function renderTest() {

  if (!m) { goDashboard(); return ''; }

function startTest() {
  state.stage = 'test';
  const m = MOCKS.find(x => x.id === state.mockId);
  if (!m) { goDashboard(); return; }
  
  state.partIndex = 0;
  state.q = 0;
  state.timeUsedTotal = 0;
  
  // Set deadline for first part
  state.deadlines = [];
  state.deadlines[0] = Date.now() + m.parts[0].time * 60 * 1000;
  
  clearInterval(timer);
  timer = setInterval(tick, 250);
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch(e) {}
  render();
}

function tick() {
  if (state.stage !== 'test') return;
  const deadline = state.deadlines[state.partIndex];
  if (!deadline) return;
  
  const rem = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  
  const t = document.getElementById('timer');
  if (t) {
    t.textContent = clock();
    t.classList.toggle('time-red', rem <= 60);
  }
  
  if (rem <= 0) {
    // Time for current part is up. Force move to next part.
    const m = MOCKS.find(x => x.id === state.mockId);
    if (state.partIndex < m.parts.length - 1) {
      state.partIndex++;
      const c = counts();
      state.q = c.startQ;
      state.deadlines[state.partIndex] = Date.now() + m.parts[state.partIndex].time * 60 * 1000;
      toast(`Part ${String.fromCharCode(64+state.partIndex)} has started.`);
      render();
    } else {
      finishExam();
    }
  }
}

function finishExam() {
  if (timer) { clearInterval(timer); timer = null; }
  const m = MOCKS.find(x => x.id === state.mockId);
  if (!m) { goDashboard(); return; }

  let correct = 0, wrong = 0, unattempted = 0;
  m.questions.forEach((q, i) => {
    const userAns = state.answers[i];
    if (userAns == null) unattempted++;
    else if (userAns === q.en.a) correct++;
    else wrong++;
  });

  const score = +(correct * m.posMark - wrong * m.negMark).toFixed(2);
  const totalAtt = correct + wrong;
  const accuracy = totalAtt > 0 ? Math.round(correct * 100 / totalAtt) : 0;

  ATTEMPTS[m.id] = {
    score, correct, wrong, unattempted, accuracy,
    timeUsed: state.timeUsedTotal,
    answers: [...state.answers],
    date: new Date().toISOString()
  };
  saveAttempts();

  state.stage = 'result';
  if (document.fullscreenElement) {
    try { document.exitFullscreen().catch(() => {}); } catch(e) {}
  }
  render();
  window.scrollTo(0, 0);
}

function updateAnswer(val) {
  state.answers[idx()] = val;
  refreshPalette();
}

function refreshPalette() {
  const c = counts();
  const allEl = document.getElementById('all-answered');
  if (allEl) allEl.textContent = c.answered + c.markedAnswered;
  const pal = document.querySelector('.palette-grid');
  if (pal) pal.innerHTML = paletteButtons();
}

function navigate(q) {
  const m = MOCKS.find(x => x.id === state.mockId);
  const c = counts();
  if (q < c.startQ || q >= c.endQ) return; // Prevent navigating outside current part
  state.q = q;
  overlay = null;
  render();
  const scroll = document.getElementById('question-scroll');
  if (scroll) scroll.scrollTop = 0;
}

/* ============================================================
   RESULT
   ============================================================ */
function renderResult() {
  const m = MOCKS.find(x => x.id === state.mockId);
  const att = ATTEMPTS[state.mockId];
  if (!m || !att) { goDashboard(); return ''; }
  
  const totalQ = m.questions.length;
  const maxMarks = m.posMark * totalQ;
  const corPct = Math.round(att.correct * 100 / totalQ);
  const wrgPct = Math.round(att.wrong * 100 / totalQ);
  const unPct = 100 - corPct - wrgPct;

  // Calculate section-wise scores
  let partStats = [];
  let startQ = 0;
  m.parts.forEach((p, i) => {
    let pCorrect = 0, pWrong = 0;
    for (let q = startQ; q < startQ + p.qCount; q++) {
      const userAns = att.answers[q];
      if (userAns != null) {
        if (userAns === m.questions[q].en.a) pCorrect++;
        else pWrong++;
      }
    }
    partStats.push({
      name: p.name,
      correct: pCorrect,
      wrong: pWrong,
      score: (pCorrect * m.posMark) - (pWrong * m.negMark)
    });
    startQ += p.qCount;
  });

  return `<div class="result-shell">
    ${wm()}
    <div class="result-card">
      <header class="result-header">
        <h2>EXAMINATION PERFORMANCE REPORT</h2>
        <p>${esc(m.title)} · ${esc(m.examLabel)}</p>
      </header>
      <div class="result-body">
        <div class="score-hero-box">
          <div class="score-hero-number">${att.score} <span style="font-size:22px; color:#64748b; font-weight:normal;">/ ${maxMarks.toFixed(1)}</span></div>
          <div class="score-hero-label">TOTAL MARKS (+${m.posMark} correct / −${m.negMark} wrong)</div>
        </div>
        
        <div class="stats-grid-cards">
          <div class="stat-pill-card correct"><div class="val">${att.correct}</div><div class="lbl">Correct</div></div>
          <div class="stat-pill-card wrong"><div class="val">${att.wrong}</div><div class="lbl">Incorrect</div></div>
          <div class="stat-pill-card unanswered"><div class="val">${att.unattempted}</div><div class="lbl">Unattempted</div></div>
          <div class="stat-pill-card accuracy"><div class="val">${att.accuracy}%</div><div class="lbl">Accuracy</div></div>
        </div>

        <div class="bar-breakdown">
          <i style="width:${corPct}%; background:var(--ok);"></i>
          <i style="width:${wrgPct}%; background:var(--bad);"></i>
          <i style="width:${unPct}%; background:#94a3b8;"></i>
        </div>
        <div style="display:flex; justify-content:center; gap:18px; font-size:11px; font-weight:bold; color:#555; margin-top:6px; flex-wrap:wrap;">
          <span style="color:var(--ok);">■ Correct (${att.correct})</span>
          <span style="color:var(--bad);">■ Incorrect (${att.wrong})</span>
          <span style="color:#64748b;">■ Unattempted (${att.unattempted})</span>
        </div>

        <h3 style="text-align:center; margin-top:30px; font-family:Arial; font-size:16px;">Section-wise Breakdown</h3>
        <table class="section-results-table">
          <tr><th>Section</th><th>Correct</th><th>Wrong</th><th>Score</th></tr>
          ${partStats.map(ps => `
            <tr>
              <td style="text-align:left;">${esc(ps.name)}</td>
              <td style="color:var(--ok); font-weight:bold;">${ps.correct}</td>
              <td style="color:var(--bad); font-weight:bold;">${ps.wrong}</td>
              <td style="font-weight:bold;">${ps.score.toFixed(1)}</td>
            </tr>
          `).join('')}
        </table>

        <div class="result-actions">
          <button class="btn-action-primary" onclick="viewSolutions('${m.id}')">View Solutions</button>
          <button class="btn-action-secondary" onclick="startMockFlow('${m.id}')">Re-attempt</button>
          <button class="btn-action-secondary" onclick="goDashboard()">Back to Mocks</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   SOLUTIONS
   ============================================================ */
function viewSolutions(mockId, filter = 'all') {
  state.mockId = mockId;
  state.solFilter = filter;
  state.stage = 'solutions';
  render();
  window.scrollTo(0, 0);
}

function setSolFilter(f) {
  state.solFilter = f;
  render();
}

function toggleSolLang() {
  state.language = state.language === 'English' ? 'Hindi' : 'English';
  render();
}

function renderSolutions() {
  const m = MOCKS.find(x => x.id === state.mockId);
  if (!m) { goDashboard(); return ''; }
  const att = ATTEMPTS[state.mockId] || { answers: [] };
  const userAnswers = att.answers || [];

  let correctCount = 0, wrongCount = 0, unattemptedCount = 0;
  m.questions.forEach((q, i) => {
    const a = userAnswers[i];
    if (a == null) unattemptedCount++;
    else if (a === q.en.a) correctCount++;
    else wrongCount++;
  });

  const filtered = [];
  m.questions.forEach((q, i) => {
    const a = userAnswers[i];
    const isCor = a === q.en.a;
    const isWrg = a != null && a !== q.en.a;
    const isUn = a == null;
    if (state.solFilter === 'all') filtered.push(i);
    else if (state.solFilter === 'correct' && isCor) filtered.push(i);
    else if (state.solFilter === 'wrong' && isWrg) filtered.push(i);
    else if (state.solFilter === 'unattempted' && isUn) filtered.push(i);
  });

  const isHindi = state.language === 'Hindi';
  const refLang = isHindi ? 'English' : 'हिन्दी';
  const anyBilingual = m.questions.some(q => q.bilingual);

  return `<div class="solutions-shell">
    ${wm()}
    <header class="sol-head">
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <button class="btn-reattempt" onclick="goDashboard()">← Dashboard</button>
        <div class="sol-title-wrap">
          <h2>SOLUTIONS &amp; ANSWER KEY</h2>
          <p>${esc(m.title)} · ${esc(m.examLabel)}</p>
        </div>
      </div>
      <div class="sol-meta-badges">
        ${att.score != null ? `<span class="sol-meta-chip score">Score: ${att.score} / ${(m.posMark * m.questions.length).toFixed(1)}</span>` : ''}
        <span class="sol-meta-chip">Total Qs: ${m.questions.length}</span>
        <button class="lang-toggle-btn" onclick="toggleSolLang()" ${anyBilingual ? '' : 'disabled title="No bilingual questions"'} style="font-size:12px; padding:6px 14px;">${refLang} Version</button>
      </div>
    </header>

    <div class="sol-filter-strip">
      <div class="sol-filters">
        <button class="filter-btn ${state.solFilter === 'all' ? 'active' : ''}" onclick="setSolFilter('all')">All (${m.questions.length})</button>
        <button class="filter-btn ${state.solFilter === 'correct' ? 'active' : ''}" onclick="setSolFilter('correct')">Correct (${correctCount})</button>
        <button class="filter-btn ${state.solFilter === 'wrong' ? 'active' : ''}" onclick="setSolFilter('wrong')">Incorrect (${wrongCount})</button>
        <button class="filter-btn ${state.solFilter === 'unattempted' ? 'active' : ''}" onclick="setSolFilter('unattempted')">Unattempted (${unattemptedCount})</button>
      </div>
      <div style="font-size:12px; color:#64748b;">Showing ${filtered.length} of ${m.questions.length}</div>
    </div>

    <main class="sol-main">
      <div class="sol-q-col">
        ${filtered.length === 0 ? '<div class="empty-state">No questions match the current filter.</div>' : ''}
        ${filtered.map(qIdx => {
          const q = m.questions[qIdx];
          const userAns = userAnswers[qIdx];
          const isCorrect = userAns === q.en.a;
          const isWrong = userAns != null && userAns !== q.en.a;
          const data = isHindi ? q.hi : q.en;

          let statusClass = 'unattempted';
          let statusText = 'Not Attempted';
          if (isCorrect) { statusClass = 'correct'; statusText = '✓ Correct (+' + m.posMark + ')'; }
          else if (isWrong) { statusClass = 'wrong'; statusText = `✗ Incorrect (−${m.negMark}) — You chose (${'ABCDE'[userAns]})`; }

          return `<div class="sol-card" id="sol-q-${qIdx}">
            <div class="sol-card-header">
              <span class="sol-q-num-badge">Question ${qIdx + 1}</span>
              <div class="sol-status-banner ${statusClass}">${statusText}</div>
            </div>
            <div class="sol-prompt">${rich(data.q)}</div>
            <div class="sol-options-list">
              ${data.o.map((opt, optIdx) => {
                const isThisCorrect = optIdx === q.en.a;
                const isThisUserWrong = optIdx === userAns && !isCorrect;
                let rowCls = '';
                let tagHtml = '';
                if (isThisCorrect) { rowCls = 'is-correct'; tagHtml = '<span class="sol-opt-tag cor">✔ Correct</span>'; }
                else if (isThisUserWrong) { rowCls = 'is-user-wrong'; tagHtml = '<span class="sol-opt-tag wrg">✘ Your Choice</span>'; }
                return `<div class="sol-opt-row ${rowCls}">
                  <span class="sol-opt-letter">(${'ABCDE'[optIdx]})</span>
                  <div class="sol-opt-text">${fmt(opt)}</div>
                  ${tagHtml}
                </div>`;
              }).join('')}
            </div>
            ${data.exp ? `<div class="sol-explanation"><b>Explanation</b>${rich(data.exp)}</div>` : ''}
          </div>`;
        }).join('')}
      </div>

      <aside class="sol-palette-col">
        <div style="font-weight:bold; font-size:13px; color:#10486d; border-bottom:1px solid #e2e8f0; padding-bottom:8px;">Quick Jump</div>
        <div class="sol-pal-grid">
          ${m.questions.map((q, i) => {
            const userAns = userAnswers[i];
            let cls = 'u';
            if (userAns === q.en.a) cls = 'c';
            else if (userAns != null) cls = 'w';
            return `<button class="sol-pal-btn ${cls}" onclick="scrollToSolQ(${i})">${i + 1}</button>`;
          }).join('')}
        </div>
        <div style="margin-top:12px; font-size:11px; display:flex; flex-direction:column; gap:4px; color:#64748b;">
          <div><span style="display:inline-block; width:10px; height:10px; background:var(--ok); border-radius:2px; margin-right:6px;"></span> Correct</div>
          <div><span style="display:inline-block; width:10px; height:10px; background:var(--bad); border-radius:2px; margin-right:6px;"></span> Incorrect</div>
          <div><span style="display:inline-block; width:10px; height:10px; background:#94a3b8; border-radius:2px; margin-right:6px;"></span> Unattempted</div>
        </div>
      </aside>
    </main>
    ${footer()}
  </div>`;
}

function scrollToSolQ(qIdx) {
  const el = document.getElementById('sol-q-' + qIdx);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  state.solFilter = 'all';
  render();
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const el2 = document.getElementById('sol-q-' + qIdx);
      if (el2) el2.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

/* ============================================================
   OVERLAYS (during exam)
   ============================================================ */
function summaryHTML() {
  const m = MOCKS.find(x => x.id === state.mockId);
  const c = counts();
  const isLast = state.partIndex === m.parts.length - 1;
  return `<div class="overlay-bg" data-action="close"></div>
  <section class="summary-pop">
    <h3 class="panel-title" style="margin:0;">Overall Examination Summary</h3>
    <div style="padding:20px;">
      <table class="candidate-table" style="margin-bottom:14px; width:100%;">
        <tr><td>Current Part Questions</td><td>${c.total}</td></tr>
        <tr><td>Answered</td><td><b style="color:var(--ok);">${c.answered + c.markedAnswered}</b></td></tr>
        <tr><td>Not Answered</td><td><b style="color:blue;">${c.notVisited}</b></td></tr>
        <tr><td>Marked for Review</td><td><b style="color:var(--bad);">${c.marked}</b></td></tr>
      </table>
      <div style="font-size:12px; color:#666; margin-bottom:14px;">
        ${isLast ? 'Submit your test for final evaluation?' : 'Proceed to the next Part? You cannot return to this part.'}
      </div>
      <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
        <button class="nav-btn" data-action="confirm-submit" style="background:var(--ok); color:#fff; min-width:130px;">Yes, ${isLast ? 'Submit' : 'Proceed'}</button>
        <button class="nav-btn" data-action="close" style="min-width:130px;">No, Continue</button>
      </div>
    </div>
  </section>`;
}

function symbolsHTML() {
  return `<div class="overlay-bg" data-action="close"></div>
  <section class="symbols-pop">
    <h3 class="panel-title" style="margin:0;">Symbols &amp; Legend</h3>
    <table>
      <tr><th>Symbol</th><th>Description</th></tr>
      <tr><td><span class="q-number">1</span></td><td>Not visited / not answered</td></tr>
      <tr><td><span class="q-number answered">1</span></td><td>Answered</td></tr>
      <tr><td><span class="q-number marked">1</span></td><td>Marked for review (not answered)</td></tr>
      <tr><td><span class="q-number answered marked">1</span></td><td>Answered &amp; marked for review</td></tr>
    </table>
    <div class="overlay-close-row"><button class="nav-btn" data-action="close">Close</button></div>
  </section>`;
}

function instructionsHTML() {
  const m = MOCKS.find(x => x.id === state.mockId);
  return `<div class="overlay-bg" data-action="close"></div>
  <section class="instructions-pop">
    <h3 class="panel-title" style="margin:0;">General Exam Instructions</h3>
    <div class="instructions-copy">
      <ul>
        <li><b>Sectional Test:</b> This test has multiple parts. You are currently in Part ${String.fromCharCode(65+state.partIndex)}. You cannot return to previous parts.</li>
        <li>Each question carries <b>+${m ? m.posMark : 0}</b> marks for a correct answer and <b>−${m ? m.negMark : 0}</b> for a wrong answer.</li>
        <li>Click <b>Save &amp; Next</b> to save your response and move to the next question.</li>
        <li>The test will auto-submit when the timer reaches 00:00.</li>
      </ul>
    </div>
    <div class="overlay-close-row"><button class="nav-btn" data-action="close">Close</button></div>
  </section>`;
}

function renderOverlay() {
  const el = document.getElementById('overlay-layer');
  if (!el) return;
  if (!overlay) { el.innerHTML = ''; return; }
  if (overlay === 'summary') el.innerHTML = summaryHTML();
  else if (overlay === 'symbols') el.innerHTML = symbolsHTML();
  else if (overlay === 'instructions') el.innerHTML = instructionsHTML();
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  let t = document.getElementById('shiksha-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'shiksha-toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:8px;font:bold 13px Arial;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:9999;opacity:0;transition:opacity .25s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  if (t._timer) clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

/* ============================================================
   RENDER / ROUTER
   ============================================================ */
function goDashboard() {
  if (timer) { clearInterval(timer); timer = null; }
  overlay = null;
  state.stage = 'dashboard';
  state.editingMock = null;
  state.parsedRows = null;
  render();
  window.scrollTo(0, 0);
}
function go(stage) {
  overlay = null;
  state.stage = stage;
  render();
  window.scrollTo(0, 0);
}

const SCREENS = {
  dashboard: renderDashboard,
  admin: renderAdmin,
  mockEditor: renderMockEditor,
  registration: renderRegistration,
  welcome: renderWelcome,
  login: renderLogin,
  verify: renderVerify,
  handwriting: renderHandwriting,
  introInstructions: renderIntroInstructions,
  introSymbols: renderIntroSymbols,
  language: renderLanguage,
  ready: renderReady,
  test: renderTest,
  result: renderResult,
  solutions: renderSolutions
};

function render() {
  document.body.classList.toggle('running', state.stage === 'test');
  document.documentElement.style.setProperty('--qfont', state.zoom + 'px');
  const fn = SCREENS[state.stage] || renderDashboard;
  app.innerHTML = fn();
  if (state.stage === 'test') renderOverlay();
}

/* ============================================================
   EVENT HANDLING
   ============================================================ */
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'registration-form') {
    state.language = document.getElementById('regional').value || 'English';
    go('welcome');
  }
});

app.addEventListener('click', e => {
  if (e.target.name === 'answer') {
    updateAnswer(Number(e.target.value));
    return;
  }
  const key = e.target.closest('[data-key]');
  if (key) {
    const p = document.getElementById('password');
    if (p) p.value = key.dataset.key === 'backspace' ? p.value.slice(0, -1) : (p.value + key.dataset.key).slice(0, 16);
    return;
  }
  const jump = e.target.closest('[data-q]');
  if (jump) { navigate(Number(jump.dataset.q)); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  switch (a) {
    case 'login-screen': go('login'); break;
    case 'verify': go('verify'); break;
    case 'handwriting': go('handwriting'); break;
    case 'intro-instructions': go('introInstructions'); break;
    case 'intro-symbols': go('introSymbols'); break;
    case 'choose-language': go('language'); break;
    case 'ready':
      state.language = document.getElementById('preferred')?.value || 'English';
      go('ready');
      break;
    case 'start': startTest(); break;
    case 'previous': navigate(state.q - 1); break;
    case 'next': 
      const m = MOCKS.find(x => x.id === state.mockId);
      const c = counts();
      if (state.q < c.endQ - 1) navigate(state.q + 1); 
      break;
    case 'next-part':
      overlay = 'summary';
      renderOverlay();
      break;
    case 'clear':
      updateAnswer(null);
      document.querySelectorAll('input[name="answer"]').forEach(r => r.checked = false);
      break;
    case 'review':
      state.review[idx()] = !state.review[idx()];
      btn.textContent = state.review[idx()] ? 'Unmark Review' : 'Mark for Review';
      refreshPalette();
      break;
    case 'palette':
      state.hidden = !state.hidden;
      render();
      break;
    case 'toggle-lang':
      state.language = state.language === 'English' ? 'Hindi' : 'English';
      render();
      break;
    case 'zoom-in':
      state.zoom = Math.min(26, state.zoom + 1);
      document.documentElement.style.setProperty('--qfont', state.zoom + 'px');
      break;
    case 'zoom-out':
      state.zoom = Math.max(12, state.zoom - 1);
      document.documentElement.style.setProperty('--qfont', state.zoom + 'px');
      break;
    case 'symbols':
    case 'summary':
    case 'instructions':
      overlay = overlay === a ? null : a;
      renderOverlay();
      break;
    case 'close':
      overlay = null;
      renderOverlay();
      break;
    case 'submit':
      overlay = 'summary';
      renderOverlay();
      break;
    case 'confirm-submit':
      const mock = MOCKS.find(x => x.id === state.mockId);
      if (state.partIndex < mock.parts.length - 1) {
        // Move to next part
        state.partIndex++;
        const c = counts();
        state.q = c.startQ;
        state.deadlines[state.partIndex] = Date.now() + mock.parts[state.partIndex].time * 60 * 1000;
        toast(`Part ${String.fromCharCode(64+state.partIndex)} has started.`);
        overlay = null;
        render();
      } else {
        finishExam();
      }
      break;
    case 'exit-exam':
      if (confirm('Exit to dashboard? Progress will be lost.')) goDashboard();
      break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay) {
    overlay = null;
    renderOverlay();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
try {
  loadSettings();
  loadMocks();
  loadAttempts();
  render();
} catch (err) {
  document.getElementById('app').innerHTML = `
    <div style="padding:40px; text-align:center; font-family:Arial;">
      <h2 style="color:red;">Fatal Error Occurred</h2>
      <p style="background:#fee; padding:20px; border:1px solid red; display:inline-block; text-align:left;">
        <b>${err.name}:</b> ${err.message}<br>
        <small style="color:#666;">${err.stack ? err.stack.split('\n')[1] : ''}</small>
      </p>
      <p style="margin-top:20px;">Please open the browser console (F12) for the full stack trace.</p>
      <p style="margin-top:20px;"><button onclick="localStorage.clear(); location.reload();" style="padding:10px 20px; font-size:16px;">Clear Saved Data & Reload</button></p>
    </div>
  `;
  console.error(err);
}
/* ============================================================
   PWA — Service Worker + Install Prompt
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => console.log('[PWA] SW registered'))
      .catch(err => console.warn('[PWA] SW failed:', err));
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallButton();
});

function showInstallButton() {
  if (document.getElementById('pwa-install-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.textContent = '📲 Install App';
  btn.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9998;background:linear-gradient(105deg,#10549b,#1d6fc2);color:white;border:0;border-radius:30px;padding:12px 22px;font:bold 14px Arial;box-shadow:0 6px 20px rgba(16,84,155,0.45);cursor:pointer;';
  btn.onclick = async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if (outcome === 'accepted') btn.remove();
    deferredInstallPrompt = null;
  };
  document.body.appendChild(btn);
  setTimeout(() => { if (btn.parentNode) btn.remove(); }, 30000);
}
</script>
</body>
</html>
